plugins {
    id 'org.springframework.boot' version '3.4.5' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.google.protobuf' version '0.9.4' apply false
}

ext {
    grpcVersion = '1.68.1'
    protobufVersion = '3.25.5'
}

// OneDrive locks files under build/ while it syncs, which makes Gradle fail with
// "Unable to delete directory". When the project lives in OneDrive, build outside it.
def localAppData = System.getenv('LOCALAPPDATA')
if (localAppData && rootDir.absolutePath.toLowerCase().contains('onedrive')) {
    allprojects {
        layout.buildDirectory.set(new File(localAppData, "finance-portfolio-build/${project.name}"))
    }
}

subprojects {
    group = 'fr.efrei.finance'
    version = '1.0.0'

    apply plugin: 'java'

    // Java 17+ is required (Spring Boot 3). Any JDK >= 17 can build the project.
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
